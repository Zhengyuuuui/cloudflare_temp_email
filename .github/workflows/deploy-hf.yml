name: Deploy Frontend to HuggingFace

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Install
        run:

          npm install


      - name: Build
        run:

          npm run build


      - name: Deploy HF Space
        uses: huggingface/hf-deploy@v1
        with:
          token: ${{ secrets.HF_TOKEN }}
          space: realyuYU/cloudflare-temp-email-ui
          path: frontend/dist
