name: Deploy Frontend to HuggingFace

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          npm install

      - name: Build
        run: |
          npm run build

      - name: Check build output
        run: |
          ls -la
          ls -la dist

      - name: Deploy to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://huggingface.co/spaces/realyuYU/cloudflare-temp-email-ui hf-space

          cp -r dist/* hf-space/

          cd hf-space

          git config user.email "github-actions@github.com"
          git config user.name "github-actions"

          git add .

          git commit -m "Deploy from GitHub Actions" || exit 0

          git push https://user:$HF_TOKEN@huggingface.co/spaces/realyuYU/cloudflare-temp-email-ui main
